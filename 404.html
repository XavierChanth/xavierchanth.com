<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex,nofollow" />
		<title>Page not found — Xavier Chanth</title>
		<style>
			:root {
				color-scheme: light;
				font-family:
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					sans-serif;
				color: rgb(17 24 39);
				background: rgb(248 245 240);
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
			}
			main {
				width: min(44rem, calc(100% - 2.5rem));
				margin: clamp(4rem, 14vh, 9rem) auto;
				padding-block: 2rem;
				border-block: 1px solid rgb(17 24 39 / 0.18);
			}
			h1 {
				margin: 0 0 1rem;
				font-family: Georgia, 'Times New Roman', serif;
				font-size: clamp(2.25rem, 8vw, 4rem);
				font-weight: 600;
				letter-spacing: -0.02em;
				line-height: 1.05;
			}
			p {
				max-width: 38rem;
				margin: 0 0 1.5rem;
				color: rgb(71 85 105);
				font-size: 1.05rem;
				line-height: 1.65;
			}
			nav {
				display: flex;
				flex-wrap: wrap;
				gap: 0.75rem 1.5rem;
			}
			a {
				color: rgb(14 116 144);
				text-decoration: underline;
				text-decoration-thickness: 1px;
				text-underline-offset: 0.2em;
			}
			a:hover {
				text-decoration-thickness: 2px;
			}
			a:focus-visible {
				outline: 3px solid rgb(14 116 144);
				outline-offset: 4px;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Page not found</h1>
			<p>
				The page you requested does not exist or may have moved. You can return to the overview or
				browse all posts.
			</p>
			<nav aria-label="Helpful links">
				<a href="/">Overview</a>
				<a href="/posts">All posts</a>
			</nav>
		</main>
	</body>
</html>
